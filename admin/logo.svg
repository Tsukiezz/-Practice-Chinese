<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="jadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b5e4a"/>
      <stop offset="100%" stop-color="#0f342c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2f5b4"/>
      <stop offset="100%" stop-color="#c5e68d"/>
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#07221c" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#jadeGrad)" filter="url(#softGlow)"/>
  <!-- Inner Border Accent -->
  <rect x="10" y="10" width="108" height="108" rx="24" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.6"/>
  <!-- Small Corner Accent -->
  <circle cx="106" cy="22" r="3.5" fill="#e2f5b4" opacity="0.8"/>
  <!-- Calligraphic Hanzi Character '汉' -->
  <text x="64" y="88" font-family="'Noto Serif SC', 'Songti SC', 'SimSun', serif" font-size="72" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-1">汉</text>
</svg>
